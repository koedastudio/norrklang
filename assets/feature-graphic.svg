<!-- Play Store feature graphic (1024x500). Export:
     rsvg-convert -w 1024 -h 500 assets/feature-graphic.svg -o assets/feature-graphic-1024x500.png
     Text is rendered with the system sans stack, matching the website. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500"
     font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <!-- Rounded card the app icon is clipped to (same radius ratio as Play's icon mask). -->
    <clipPath id="icon-card">
      <rect x="432" y="76" width="160" height="160" rx="36"/>
    </clipPath>
  </defs>

  <rect width="1024" height="500" fill="#0B0D10"/>

  <!-- App icon: the artwork from icon.svg (1024-space) mapped onto 160px. -->
  <g clip-path="url(#icon-card)">
    <g transform="translate(432 76) scale(0.15625)">
      <rect width="1024" height="512" fill="#C6F0EA"/>
      <rect y="512" width="1024" height="512" fill="#0DA1A6"/>
      <path d="M512 102L922 512H102L512 102Z" fill="#1FB8B0"/>
      <g>
        <clipPath id="reflection">
          <path d="M102 512H922L512 922Z"/>
        </clipPath>
        <g clip-path="url(#reflection)" fill="#38D7DD">
          <rect x="102" y="512" width="70" height="410"/>
          <rect x="227" y="512" width="70" height="410"/>
          <rect x="352" y="512" width="70" height="410"/>
          <rect x="477" y="512" width="70" height="410"/>
          <rect x="602" y="512" width="70" height="410"/>
          <rect x="727" y="512" width="70" height="410"/>
          <rect x="852" y="512" width="70" height="410"/>
        </g>
      </g>
    </g>
  </g>

  <text x="512" y="330" text-anchor="middle" font-size="62" font-weight="700"
        fill="#F2F4F7">Norrklang</text>
  <text x="512" y="384" text-anchor="middle" font-size="29" font-weight="400"
        fill="#98A2B3">Your music library, in your car</text>
  <text x="512" y="434" text-anchor="middle" font-size="21" font-weight="500"
        letter-spacing="0.5" fill="#4FD8C4" opacity="0.85">Navidrome&#160;&#160;·&#160;&#160;Subsonic&#160;&#160;·&#160;&#160;Plex&#160;&#160;·&#160;&#160;Jellyfin</text>
</svg>
