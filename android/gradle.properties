# ── App version — the ONLY value to edit before a release ────────────────────
# Format: <versionName>+<buildNumber>
#   new release       → bump the semver part, reset "+N" to 0
#   re-upload to Play → bump "+N" only (Play rejects duplicate versionCodes)
# Parsed by build-logic (ProjectDefaults) into versionName and one versionCode
# per form factor. Record every release in CHANGELOG.md.
norrklang.version=1.0.0+2

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
